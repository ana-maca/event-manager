spring.application.name=event-manager

# --- PostgreSQL connection ---
# Override these with env vars (DB_URL, DB_USERNAME, DB_PASSWORD) or edit directly.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:username}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# update = auto-create/alter tables on startup so the app runs with a fresh DB.
# Switch to 'validate' once you introduce a real migration tool (Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

server.port=8080
